<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 940" width="1240" height="940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B84FF"/>
      <stop offset="1" stop-color="#6B46FF"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="gMask">
      <rect x="0" y="0" width="140" height="140" fill="#fff"/>
      <text x="70" y="103" font-size="94" font-weight="600" text-anchor="middle" fill="#000">g</text>
    </mask>
  </defs>

  <rect width="1240" height="940" fill="#0B0B10"/>

  <text x="60" y="64" font-size="26" font-weight="600" fill="#ffffff">Glyf — symbol concepts</text>
  <text x="60" y="94" font-size="15" fill="#8B8B99">Accent #7C5CFF · keycap geometry · radius 30% · one accent, nothing else</text>

  <!-- ============ ROW 1 ============ -->

  <!-- 1. Bound Key -->
  <g transform="translate(60,140)">
    <rect x="0" y="0" width="140" height="140" rx="42" fill="url(#cap)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="108" cy="32" r="11" fill="#7C5CFF" filter="url(#soft)"/>
    <text x="70" y="103" font-size="72" font-weight="500" text-anchor="middle" fill="#ffffff" fill-opacity="0.92">g</text>
  </g>
  <text x="60" y="312" font-size="15" font-weight="600" fill="#ffffff">01 · Bound Key</text>
  <text x="60" y="334" font-size="13" fill="#8B8B99">The logo IS the product's own</text>
  <text x="60" y="352" font-size="13" fill="#8B8B99">"this key has a glyf" indicator.</text>
  <text x="60" y="370" font-size="13" fill="#32D583">Recommended.</text>

  <!-- 2. Negative G -->
  <g transform="translate(300,140)">
    <rect x="0" y="0" width="140" height="140" rx="42" fill="url(#accentGrad)" mask="url(#gMask)"/>
  </g>
  <text x="300" y="312" font-size="15" font-weight="600" fill="#ffffff">02 · Negative Key</text>
  <text x="300" y="334" font-size="13" fill="#8B8B99">Solid accent keycap, letter</text>
  <text x="300" y="352" font-size="13" fill="#8B8B99">knocked out. Strong at 1024px,</text>
  <text x="300" y="370" font-size="13" fill="#8B8B99">muddy at 29px.</text>

  <!-- 3. Hold Ripple -->
  <g transform="translate(540,140)">
    <rect x="-14" y="-14" width="168" height="168" rx="52" fill="none" stroke="#7C5CFF" stroke-opacity="0.16" stroke-width="2"/>
    <rect x="-4" y="-4" width="148" height="148" rx="46" fill="none" stroke="#7C5CFF" stroke-opacity="0.34" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="140" rx="42" fill="url(#cap)" stroke="#7C5CFF" stroke-opacity="0.75" stroke-width="2"/>
    <circle cx="70" cy="70" r="15" fill="#7C5CFF"/>
  </g>
  <text x="540" y="312" font-size="15" font-weight="600" fill="#ffffff">03 · Hold Ripple</text>
  <text x="540" y="334" font-size="13" fill="#8B8B99">"Press to type, hold to act"</text>
  <text x="540" y="352" font-size="13" fill="#8B8B99">drawn literally. Animates</text>
  <text x="540" y="370" font-size="13" fill="#8B8B99">beautifully in onboarding.</text>

  <!-- 4. The Mark -->
  <g transform="translate(780,140)">
    <rect x="0" y="0" width="140" height="140" rx="42" fill="url(#cap)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
    <path d="M46 44 L46 96 Q46 112 62 112 L86 112" fill="none" stroke="#7C5CFF" stroke-width="9" stroke-linecap="round"/>
    <path d="M94 44 L94 84" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="9" stroke-linecap="round"/>
    <circle cx="94" cy="106" r="6" fill="#7C5CFF"/>
  </g>
  <text x="780" y="312" font-size="15" font-weight="600" fill="#ffffff">04 · The Mark</text>
  <text x="780" y="334" font-size="13" fill="#8B8B99">Abstract glyph — reads as a rune,</text>
  <text x="780" y="352" font-size="13" fill="#8B8B99">not a letter. Most ownable,</text>
  <text x="780" y="370" font-size="13" fill="#8B8B99">least immediately legible.</text>

  <!-- 5. Action Caret -->
  <g transform="translate(1020,140)">
    <rect x="0" y="0" width="140" height="140" rx="42" fill="url(#cap)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
    <path d="M50 46 L84 70 L50 94" fill="none" stroke="#7C5CFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M78 104 L104 104" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="9" stroke-linecap="round"/>
  </g>
  <text x="1020" y="312" font-size="15" font-weight="600" fill="#ffffff">05 · Action Caret</text>
  <text x="1020" y="334" font-size="13" fill="#8B8B99">Cursor turning into a play head.</text>
  <text x="1020" y="352" font-size="13" fill="#8B8B99">Clear, but generic — a lot of</text>
  <text x="1020" y="370" font-size="13" fill="#8B8B99">dev tools already look like this.</text>

  <!-- ============ ROW 2: scale test ============ -->
  <text x="60" y="440" font-size="15" font-weight="600" fill="#ffffff">Scale test — concept 01 at real icon sizes</text>
  <text x="60" y="462" font-size="13" fill="#8B8B99">If it fails at 29px it fails. Settings list icons are 29pt.</text>

  <g transform="translate(60,486)">
    <rect x="0" y="0" width="120" height="120" rx="36" fill="url(#cap)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.4"/>
    <circle cx="93" cy="27" r="9.5" fill="#7C5CFF"/>
    <text x="60" y="88" font-size="62" font-weight="500" text-anchor="middle" fill="#ffffff" fill-opacity="0.92">g</text>
  </g>
  <text x="60" y="626" font-size="12" fill="#8B8B99">120px</text>

  <g transform="translate(220,516)">
    <rect x="0" y="0" width="60" height="60" rx="18" fill="url(#cap)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="46.5" cy="13.5" r="5" fill="#7C5CFF"/>
    <text x="30" y="44" font-size="31" font-weight="500" text-anchor="middle" fill="#ffffff" fill-opacity="0.92">g</text>
  </g>
  <text x="220" y="626" font-size="12" fill="#8B8B99">60px</text>

  <g transform="translate(320,531)">
    <rect x="0" y="0" width="40" height="40" rx="12" fill="url(#cap)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.8"/>
    <circle cx="31" cy="9" r="3.6" fill="#7C5CFF"/>
    <text x="20" y="29" font-size="21" font-weight="500" text-anchor="middle" fill="#ffffff" fill-opacity="0.92">g</text>
  </g>
  <text x="320" y="626" font-size="12" fill="#8B8B99">40px</text>

  <g transform="translate(400,536.5)">
    <rect x="0" y="0" width="29" height="29" rx="9" fill="url(#cap)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.7"/>
    <circle cx="22.5" cy="6.5" r="2.8" fill="#7C5CFF"/>
    <text x="14.5" y="21" font-size="15" font-weight="500" text-anchor="middle" fill="#ffffff" fill-opacity="0.92">g</text>
  </g>
  <text x="400" y="626" font-size="12" fill="#8B8B99">29px</text>

  <!-- monochrome + light -->
  <g transform="translate(500,486)">
    <rect x="0" y="0" width="120" height="120" rx="36" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.4"/>
    <circle cx="93" cy="27" r="9.5" fill="#ffffff"/>
    <text x="60" y="88" font-size="62" font-weight="500" text-anchor="middle" fill="#ffffff">g</text>
  </g>
  <text x="500" y="626" font-size="12" fill="#8B8B99">monochrome</text>

  <g transform="translate(660,486)">
    <rect x="-10" y="-10" width="140" height="140" rx="42" fill="#F2F2F7"/>
    <rect x="0" y="0" width="120" height="120" rx="36" fill="#ffffff" stroke="#000000" stroke-opacity="0.10" stroke-width="1.4"/>
    <circle cx="93" cy="27" r="9.5" fill="#7C5CFF"/>
    <text x="60" y="88" font-size="62" font-weight="500" text-anchor="middle" fill="#1C1C1E">g</text>
  </g>
  <text x="660" y="626" font-size="12" fill="#8B8B99">light mode</text>

  <!-- in-context: keyboard row -->
  <g transform="translate(840,486)">
    <rect x="0" y="0" width="330" height="120" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <g transform="translate(16,30)">
      <rect x="0" y="0" width="56" height="60" rx="10" fill="#ffffff" fill-opacity="0.16"/>
      <text x="28" y="40" font-size="22" text-anchor="middle" fill="#fff">a</text>
    </g>
    <g transform="translate(80,30)">
      <rect x="0" y="0" width="56" height="60" rx="10" fill="#7C5CFF" fill-opacity="0.16" stroke="#7C5CFF" stroke-opacity="0.4"/>
      <text x="28" y="40" font-size="22" text-anchor="middle" fill="#fff">s</text>
      <circle cx="46" cy="11" r="3.4" fill="#7C5CFF"/>
    </g>
    <g transform="translate(144,30)">
      <rect x="0" y="0" width="56" height="60" rx="10" fill="#ffffff" fill-opacity="0.16"/>
      <text x="28" y="40" font-size="22" text-anchor="middle" fill="#fff">d</text>
    </g>
    <g transform="translate(208,30)">
      <rect x="0" y="0" width="56" height="60" rx="10" fill="#7C5CFF" fill-opacity="0.16" stroke="#7C5CFF" stroke-opacity="0.4"/>
      <text x="28" y="40" font-size="22" text-anchor="middle" fill="#fff">c</text>
      <circle cx="46" cy="11" r="3.4" fill="#7C5CFF"/>
    </g>
    <g transform="translate(272,30)">
      <rect x="0" y="0" width="42" height="60" rx="10" fill="#ffffff" fill-opacity="0.16"/>
      <text x="21" y="40" font-size="22" text-anchor="middle" fill="#fff">f</text>
    </g>
  </g>
  <text x="840" y="626" font-size="12" fill="#8B8B99">in context — bound keys carry the same dot as the logo</text>

  <!-- ============ ROW 3: wordmark ============ -->
  <text x="60" y="700" font-size="15" font-weight="600" fill="#ffffff">Wordmark</text>

  <g transform="translate(60,720)">
    <text x="0" y="70" font-size="82" font-weight="600" fill="#ffffff" letter-spacing="-3">glyf</text>
    <circle cx="178" cy="24" r="9" fill="#7C5CFF"/>
  </g>
  <text x="60" y="836" font-size="13" fill="#8B8B99">Primary — the accent dot rides above the f,</text>
  <text x="60" y="854" font-size="13" fill="#8B8B99">echoing the bound-key indicator.</text>

  <g transform="translate(420,720)">
    <rect x="0" y="12" width="58" height="58" rx="17" fill="url(#cap)" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="45" cy="25" r="4.6" fill="#7C5CFF"/>
    <text x="29" y="54" font-size="30" font-weight="500" text-anchor="middle" fill="#ffffff">g</text>
    <text x="74" y="60" font-size="46" font-weight="600" fill="#ffffff" letter-spacing="-1.5">glyf</text>
  </g>
  <text x="420" y="836" font-size="13" fill="#8B8B99">Lockup — mark + wordmark, for the</text>
  <text x="420" y="854" font-size="13" fill="#8B8B99">App Store header and website.</text>

  <g transform="translate(760,720)">
    <text x="0" y="60" font-size="42" font-weight="500" fill="#8B8B99" letter-spacing="-1">every key is a</text>
    <text x="252" y="60" font-size="42" font-weight="600" fill="#ffffff" letter-spacing="-1">glyf</text>
    <circle cx="336" cy="30" r="5" fill="#7C5CFF"/>
  </g>
  <text x="760" y="836" font-size="13" fill="#8B8B99">Tagline lockup.</text>
</svg>
