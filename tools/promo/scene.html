<!doctype html>
<meta charset="utf-8">
<title>Glyf waitlist film</title>
<!--
  The waitlist film, one frame at a time. 1920x1080.

  Laid out like the desktop site: the headline on the left, the phone on the
  right, the headline changing as the phone proves it. Four acts, each a
  scenario of two or three messages, none of them language-specific.

    0  the keyboard forms      Type less. glyf more.
    1  a bill split            Do the math. Get paid.
    2  a private payment       Pay on Solana. Privately.
    3  a rewrite               Type it messy. Send it polished.
    4  the card                The AI keyboard that does the rest.

  Nothing animates by itself: `seek(f)` draws frame f and only frame f, which
  is what makes the render deterministic. render.mjs walks the timeline.

  The keyboard is the real one's arithmetic, out of GlassTokens.swift: 6.5pt
  margins, 6pt between keys, a 54pt row pitch, a 43pt key at 402pt wide. Apple's
  keys and Glyf's land in exactly the same places, which is the point of act 0.
-->
<style>

  #head { position: absolute; top: 424px; width: 860px;

  #head b.dim { color: #8b8b93; }

                  border-radius: 12px; background: rgba(124,92,255,.1); }
  #wallet .priv span { position: absolute; left: 13px; top: 12px; font: 500 13px Inter; color: #6f52e8; }

                     font: 600 16px/46px Inter; letter-spacing: -.01em; }

  /* Where the AI is working, over the strip. */

</style>

      </svg>

<script>
// ======================================================== easing
const cl = v => v < 0 ? 0 : v > 1 ? 1 : v;
const seg = (f, a, b) => cl((f - a) / (b - a));
const outQuint = x => 1 - Math.pow(1 - x, 5);
const outCubic = x => 1 - Math.pow(1 - x, 3);
const inCubic = x => x * x * x;
const inOutQuint = x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2;
/** Lands with one small overshoot and stops. Lower bounce than a real spring:
 *  on a 24 second film anything springier reads as wobble. */
const settle = (x, bounce = 1.25) =>
  x >= 1 ? 1 : 1 - Math.pow(2, -10 * x) * Math.cos(x * Math.PI * bounce);
const mix = (a, b, x) => a + (b - a) * x;
/** In and out again: for something that appears, holds, and leaves. */
const pulse = (f, a, b, riseF = 20, fallF = 18) =>
  Math.min(outQuint(seg(f, a, a + riseF)), 1 - outQuint(seg(f, b - fallF, b)));

// ======================================================== keyboard
const W = 402, MARGIN = 6.5, HGAP = 6, PITCH = 54, KEYH = 43;
const KEYW = (W - MARGIN * 2 - HGAP * 9) / 10;
const SIDEW = KEYW * 1.35;
const SHEET_H = 343, TOOLS_H = 57;
const BOUND = new Set(["v", "c"]);
const ROWS = [
  "qwertyuiop".split("").map(k => ({ k, w: KEYW })),
  "asdfghjkl".split("").map(k => ({ k, w: KEYW })),
  [{ k: "⇧", w: SIDEW, fn: 1 }, ..."zxcvbnm".split("").map(k => ({ k, w: KEYW })), { k: "⌫", w: SIDEW, fn: 1 }],
  [{ k: "123", w: SIDEW, fn: 1 }, { k: "☺", w: KEYW, fn: 1 }, { k: "space", w: 0 }, { k: "⏎", w: SIDEW, fn: 1 }],
];
const keysEl = document.getElementById("keys");
const cells = [];
ROWS.forEach((row, r) => {
  const sp = row.find(c => c.k === "space");
  if (sp) sp.w = W - MARGIN * 2 - (row.reduce((s, c) => s + c.w, 0) + HGAP * (row.length - 1));
  let x = r === 1 ? MARGIN + (KEYW + HGAP) / 2 : MARGIN;
  row.forEach((c, i) => {
    const el = document.createElement("div");
    el.className = "key" + (c.fn ? " fn" : "") + (c.k === "space" ? " space" : "");
    Object.assign(el.style, { left: x + "px", top: (TOOLS_H + r * PITCH) + "px",
                              width: c.w + "px", height: KEYH + "px" });
    const s = document.createElement("span");
    s.textContent = c.k === "space" ? "" : c.k;
    const dot = document.createElement("i"); dot.className = "dot";
    el.append(s, dot); keysEl.appendChild(el);
    cells.push({ el, span: s, dot, ...c, row: r, col: i, cx: x + c.w / 2, cy: TOOLS_H + r * PITCH + KEYH / 2 });
    x += c.w + HGAP;
  });
});
const key = k => cells.find(c => c.k === k);

// The tool strip, spaced by one gap the way the real one is.
const NS = "http://www.w3.org/2000/svg";
const TOOLS = ["grid",
  "M10.2 3.6a6.6 6.6 0 1 0 0 13.2 6.6 6.6 0 0 0 0-13.2Z|M15.2 15.2l5 5",
  "M6.4 2.8h7.2a2 2 0 0 1 2 2v9.6a2 2 0 0 1-2 2H6.4a2 2 0 0 1-2-2V4.8a2 2 0 0 1 2-2Z|M8.6 6.2h9a2 2 0 0 1 2 2v9.6a2 2 0 0 1-2 2h-7.2a2 2 0 0 1-2-2",
  "M3.4 4.6h17.2a1.8 1.8 0 0 1 1.8 1.8v11.2a1.8 1.8 0 0 1-1.8 1.8H3.4a1.8 1.8 0 0 1-1.8-1.8V6.4a1.8 1.8 0 0 1 1.8-1.8Z|M7.6 12.4a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4Z|M4.4 16.4c.6-1.8 1.9-2.6 3.2-2.6s2.6.8 3.2 2.6|M14 9.4h5|M14 12.6h5",
  "M12 2.6a3 3 0 0 1 3 3v5.8a3 3 0 1 1-6 0V5.6a3 3 0 0 1 3-3Z|M5.4 11.2a6.6 6.6 0 0 0 13.2 0|M12 17.8v3.6",
  "M2.6 5.2h9|M7.1 3.2v2|M9.4 12.4c-2.6-.9-4.4-3-4.8-7.2|M3 12.4c3.6 0 6.6-2.2 7.4-7.2|M12.8 20.8l4.2-10 4.2 10|M14.3 17.6h5.4"];
const toolsEl = document.getElementById("tools"), toolEls = [];
{
  const G = 20, PAD = 12, M = 16, SLACK = 3;
  const boxes = TOOLS.map((_, i) => G + 2 * (PAD + (i ? 0 : SLACK)));
  const gap = (W - 2 * (M - PAD) - boxes.reduce((a, b) => a + b, 0)) / (TOOLS.length - 1);
  let x = M - PAD - SLACK;
  TOOLS.forEach((d, i) => {
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "tool"); svg.setAttribute("width", G); svg.setAttribute("height", G);
    svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "#1d1d1f"); svg.setAttribute("stroke-width", "1.7");
    svg.setAttribute("stroke-linecap", "round"); svg.setAttribute("stroke-linejoin", "round");
    if (d === "grid") {
      const tile = (cx, cy, s, r, rot) => {
        const p = document.createElementNS(NS, "rect");
        p.setAttribute("x", cx - s / 2); p.setAttribute("y", cy - s / 2);
        p.setAttribute("width", s); p.setAttribute("height", s); p.setAttribute("rx", r);
        if (rot) p.setAttribute("transform", `rotate(45 ${cx} ${cy})`);
        svg.appendChild(p);
      };
      tile(6.9, 6.9, 9.2, 1.9); tile(6.9, 17.1, 9.2, 1.9); tile(17.1, 17.1, 9.2, 1.9);
      tile(17.1, 6.9, 7.5, 1.7, true);
    } else d.split("|").forEach(seg => {
      const p = document.createElementNS(NS, "path"); p.setAttribute("d", seg); svg.appendChild(p);
    });
    svg.style.left = (x + PAD + (i ? 0 : SLACK)) + "px";
    toolsEl.appendChild(svg); toolEls.push(svg);
    x += boxes[i] + gap;
  });
}

// ======================================================== the script
const ADDR = "8QvS3nE5d1YwZk7pLr2mXh9TbF4cJaGuVy6oKe1RtNqP";
const ACTS = [
  { at: 0, who: ["S", "#ff9f0a", "Sam"], eyebrow: "", head: ["Type less.", "glyf more."],
    note: "The keyboard you already know. With everything it never had.", msgs: [] },
  { at: 300, who: ["M", "#ff375f", "Mia"], eyebrow: "Split a bill", head: ["Do the math.", "Get paid."],
    note: "The sum is in the strip before you reach for a calculator.",
    msgs: [{ s: "them", t: "dinner was $348 for the four of us 🍝" },
           { s: "them", t: "what do I owe you?" },
           { s: "me", t: "$87" }] },
  { at: 690, who: ["D", "#bf5af2", "Dev"], eyebrow: "Pay on Solana", head: ["Pay on Solana.", "Privately."],
    note: "USDC, sent from the keyboard. Nobody onchain sees who paid.",
    msgs: [{ s: "them", t: "can you send $200 USDC for the servers?" },
           { s: "them", t: ADDR, cls: "addr" },
           { s: "me", cls: "pay" }] },
  { at: 1140, who: ["A", "#5e5ce6", "Alex"], eyebrow: "Ask Glyf", head: ["Type it messy.", "Send it polished."],
    note: "Hold the space bar. It rewrites what you meant to say.",
    msgs: [{ s: "them", t: "Could you send the Q3 deck to the client by EOD?" },
           { s: "me", t: "Absolutely, I'll have it over to them by 6." }] },
];
const CARD = 1500, LAST = 1710;

// Build every act's bubbles once; the thread shows one act at a time.
const threadEl = document.getElementById("thread");
ACTS.forEach(a => {
  a.el = [];
  a.msgs.forEach(m => {
    const d = document.createElement("div");
    d.className = "msg " + m.s + (m.cls ? " " + m.cls : "");
    if (m.cls === "pay") {
      d.innerHTML = '<span class="lock">🔒 Sent privately</span>' +
                    '<b class="amt">$200.00</b><span class="chain">USDC on Solana · MagicBlock</span>';
    } else d.textContent = m.t;
    d.style.opacity = 0;
    threadEl.appendChild(d); a.el.push(d);
  });
});
// Lay each act out from the bottom: y[i][k] is where bubble i sits once k are up.
const THREAD_H = 894 - 114 - 343, GAP = 7;
ACTS.forEach(a => {
  const h = a.el.map(e => e.getBoundingClientRect().height / 1.04478);
  a.y = a.el.map(() => []);
  for (let k = 1; k <= a.el.length; k++) {
    let bottom = THREAD_H - 10;
    for (let i = k - 1; i >= 0; i--) { bottom -= h[i]; a.y[i][k] = bottom; bottom -= GAP; }
  }
  a.el.forEach((e, i) => { e.style.top = "0px"; });
});

// ======================================================== drawing
const S = {
  head: document.getElementById("head"), eyebrow: document.getElementById("eyebrow"),
  note: document.getElementById("note"), av: document.querySelector("#who .av"),
  nm: document.querySelector("#who .nm"), tx: document.querySelector("#field .tx"),
  caret: document.getElementById("caret"), send: document.getElementById("send"),
  chip: document.getElementById("chip"), chipK: document.querySelector("#chip .k"),
  chipV: document.querySelector("#chip .v"), chipTap: document.querySelector("#chip .tap"),
  think: document.getElementById("think"), wallet: document.getElementById("wallet"),
  ptr: document.getElementById("ptr"), phone: document.getElementById("phone"),
  card: document.getElementById("card"), glow: document.getElementById("glow"),
  left: document.getElementById("left"),
};
let headKey = "";

/** The pointer: glides to a point, presses, and goes. */
function tapAt(f, a, x, y, hold = 26) {
  const come = outQuint(seg(f, a - 22, a));
  const vis = pulse(f, a - 22, a + hold + 16, 16, 14);
  const press = pulse(f, a, a + 13, 5, 7);
  S.ptr.style.opacity = Math.max(Number(S.ptr.style.opacity) || 0, vis);
  if (vis > 0.01) {
    const fromX = x - 46, fromY = y + 60;
    S.ptr.style.transform =
      `translate(${mix(fromX, x, come)}px, ${mix(fromY, y, come)}px) scale(${mix(1, .72, press)})`;
  }
  return press;
}
/** A key dips when it is pressed. */
function press(cell, k) { if (cell) cell.el.style.filter = k > .2 ? "brightness(.9)" : ""; }

function draw(f) {
  // --- which act -------------------------------------------------------
  // The swap happens in the DARK, 18 frames before the act starts: the old
  // words fade out, the text is exchanged while nothing is on screen, and the
  // new words fade in. Swapping on the way in instead left a stretch with no
  // headline at all, which reads as a dropped frame.
  let act = ACTS[0], idx = 0;
  ACTS.forEach((a, i) => { if (f >= a.at - 18) { act = a; idx = i; } });
  const nextAt = idx < ACTS.length - 1 ? ACTS[idx + 1].at : 1e9;
  const swapOut = nextAt - 18;
  const alive = f < swapOut - 22 ? 1 : 1 - outQuint(seg(f, swapOut - 22, swapOut));

  S.ptr.style.opacity = 0;
  cells.forEach(c => { c.el.style.filter = ""; });

  // --- the left column, crossfading ------------------------------------
  const inHead = outQuint(seg(f, act.at - 26, act.at + 20));
  const k = `${idx}`;
  if (headKey !== k) {
    headKey = k;
    S.head.innerHTML = `<b>${act.head[0]}</b><b class="dim">${act.head[1]}</b>`;
    S.eyebrow.textContent = act.eyebrow;
    S.note.textContent = act.note;
    S.av.textContent = act.who[0]; S.av.style.background = act.who[1]; S.nm.textContent = act.who[2];
  }
  [[S.eyebrow, 0], [S.head, 6], [S.note, 12]].forEach(([el, d]) => {
    const a = outQuint(seg(f, act.at - 18 + d, act.at + 30 + d));
    el.style.opacity = a * alive;
    el.style.transform = `translateY(${mix(26, 0, a) - (1 - alive) * 16}px)`;
  });

  // --- the phone: a slow float so nothing is ever quite still -----------
  const bob = Math.sin(f / 118) * 5 + Math.sin(f / 61) * 1.6;
  S.phone.style.transform = `translateY(${bob}px)`;
  S.glow.style.transform = `translate(${Math.sin(f / 200) * 60}px, ${Math.cos(f / 240) * 40}px)`;

  // --- bubbles ----------------------------------------------------------
  ACTS.forEach((a, i) => {
    const mine = i === idx;
    a.el.forEach((el, j) => {
      if (!mine) { el.style.opacity = 0; return; }
      // The thread leaves with the words it belonged to.
      const born = (a.beats || [])[j] ?? (a.at + 40 + j * 46);
      const shown = a.el.filter((_, n) => f >= ((a.beats || [])[n] ?? (a.at + 40 + n * 46))).length;
      const app = outQuint(seg(f, born, born + 24));
      const yNow = a.y[j][Math.max(shown, j + 1)] ?? a.y[j][j + 1];
      const yPrev = a.y[j][Math.max(shown - 1, j + 1)] ?? yNow;
      const slide = outQuint(seg(f, born + (shown - 1 - j) * 0, born + 26));
      el.style.opacity = app * alive;
      el.style.top = mix(yPrev, yNow, 1) + "px";
      el.style.transform =
        `translateY(${mix(16, 0, app)}px) scale(${mix(.86, 1, settle(app, 1.1))})`;
      el.style.transformOrigin = el.classList.contains("me") ? "100% 100%" : "0 100%";
    });
  });

  // --- the acts themselves ---------------------------------------------
  drawKeyboard(f);
  A0(f); A1(f); A2(f); A3(f); A4(f);
}

// ---- act 0: the keyboard forms ----------------------------------------
const DRAFT0 = "hey, what time works for";
function A0(f) {
  const typed = Math.round(mix(0, DRAFT0.length, outCubic(seg(f, 16, 92))));
  const kept = f < 104 ? typed : Math.round(mix(DRAFT0.length, 0, seg(f, 104, 130)));
  if (f < 300) {
    S.tx.textContent = DRAFT0.slice(0, Math.max(0, kept));
    S.caret.style.opacity = f > 136 ? 0 : (Math.floor(f / 28) % 2 ? .3 : 1);
    S.caret.style.left = (15 + S.tx.getBoundingClientRect().width / 1.04478) + "px";
    S.send.style.opacity = 0;
  }
}
// ---- act 1: the bill ---------------------------------------------------
ACTS[1].beats = [ACTS[1].at + 30, ACTS[1].at + 96, ACTS[1].at + 286];
function A1(f) {
  const a = ACTS[1].at;
  if (f < a - 26 || f > ACTS[2].at - 26) return;
  const draft = "348/4";
  const typed = Math.round(mix(0, draft.length, outCubic(seg(f, a + 150, a + 196))));
  const cleared = f > a + 276;
  S.tx.textContent = cleared ? "" : draft.slice(0, typed);
  S.caret.style.opacity = cleared ? 0 : (Math.floor(f / 28) % 2 ? .3 : 1);
  S.caret.style.left = (15 + S.tx.getBoundingClientRect().width / 1.04478) + "px";
  S.send.style.opacity = 0;

  // the sum arrives in the strip, gets tapped, and becomes the message
  const chip = pulse(f, a + 200, a + 286, 18, 14);
  S.chip.style.opacity = chip;
  S.chip.style.transform = `translateY(${mix(10, 0, outQuint(seg(f, a + 200, a + 224)))}px)`;
  S.chipK.textContent = "348 ÷ 4"; S.chipV.textContent = "";
  S.chipV.style.left = "84px"; S.chipV.textContent = "= $87";
  S.chipTap.style.opacity = 1;
  toolsEl.style.opacity = Math.min(1, 1 - chip * .95);
  tapAt(f, a + 262, 200, 57 + 11 + 17, 10);
}
// ---- act 2: the payment ------------------------------------------------
ACTS[2].beats = [ACTS[2].at + 26, ACTS[2].at + 92, ACTS[2].at + 366];
function A2(f) {
  const a = ACTS[2].at;
  if (f < a - 26 || f > ACTS[3].at - 26) return;
  S.tx.textContent = ""; S.caret.style.opacity = 0; S.send.style.opacity = 0;

  // tap the address, the strip offers to pay, the wallet slides up
  const tapAddr = tapAt(f, a + 150, 130, 300, 8);
  const chip = pulse(f, a + 176, a + 250, 16, 12);
  S.chip.style.opacity = Math.max(S.chip.style.opacity || 0, chip);
  if (chip > .01) {
    S.chip.style.transform = `translateY(${mix(10, 0, outQuint(seg(f, a + 176, a + 198)))}px)`;
    S.chipK.textContent = "Pay"; S.chipV.style.left = "46px";
    S.chipV.textContent = "$200 USDC to Dev"; S.chipTap.style.opacity = 1;
  }
  toolsEl.style.opacity = Math.min(toolsEl.style.opacity === "" ? 1 : Number(toolsEl.style.opacity),
                                   1 - Math.max(chip, 0) * .95);
  tapAt(f, a + 232, 200, 85, 8);

  const w = pulse(f, a + 246, a + 356, 22, 16);
  S.wallet.style.opacity = w;
  S.wallet.style.transform = `translateY(${mix(286, 0, settle(seg(f, a + 246, a + 300), 1.1))}px)`;
  tapAt(f, a + 330, 200, 343 - 286 + 247, 8);
}
// ---- act 3: the rewrite ------------------------------------------------
ACTS[3].beats = [ACTS[3].at + 26, ACTS[3].at + 276];
const MESSY = "ya ill send it by 6 dont worry";
function A3(f) {
  const a = ACTS[3].at;
  if (f < a - 26 || f > CARD - 26) return;
  const typed = Math.round(mix(0, MESSY.length, outCubic(seg(f, a + 74, a + 168))));
  const done = f > a + 262;
  S.tx.textContent = done ? "" : MESSY.slice(0, typed);
  S.caret.style.opacity = done ? 0 : (Math.floor(f / 28) % 2 ? .3 : 1);
  S.caret.style.left = (15 + S.tx.getBoundingClientRect().width / 1.04478) + "px";

  // hold the space bar, the strip thinks, the words change
  const sp = key("space");
  const hold = pulse(f, a + 178, a + 214, 8, 8);
  if (sp) sp.el.style.filter = hold > .2 ? "brightness(.93)" : "";
  tapAt(f, a + 186, 201, 57 + 3 * PITCH + KEYH / 2, 24);

  const th = pulse(f, a + 200, a + 262, 16, 12);
  S.think.style.opacity = th;
  toolsEl.style.opacity = Math.min(1, 1 - th * .95);
  document.querySelectorAll("#think .d").forEach((d, i) => {
    const t = (f / 9 + i * .9) % 6;
    d.style.left = (20 + i * 11) + "px";
    d.style.opacity = .35 + .65 * Math.max(0, Math.sin(t));
  });
}
// ---- act 4: the card ---------------------------------------------------
function A4(f) {
  const out = inOutQuint(seg(f, CARD - 40, CARD + 60));
  S.phone.style.opacity = 1 - cl(out * 1.5);
  S.phone.style.transform += ` translateX(${mix(0, 150, out)}px) scale(${mix(1, .94, out)})`;
  S.left.style.opacity = 1 - cl(out * 1.8);
  S.card.style.opacity = cl(seg(f, CARD + 6, CARD + 40));
  const rise = (sel, d, dy) => {
    const el = S.card.querySelector(sel);
    const a = outQuint(seg(f, CARD + d, CARD + d + 46));
    el.style.opacity = a;
    const cx = sel === "h1" || sel === ".url" ? "" : "translateX(-50%) ";
    el.style.transform = `${cx}translateY(${mix(dy, 0, a)}px)`;
  };
  rise(".wm", 10, 22); rise("h1", 22, 30); rise(".cta", 40, 26); rise(".url", 54, 20);
}

// ---- the keys, forming in act 0 then staying ---------------------------
function drawKeyboard(f) {
  cells.forEach(c => {
    const order = c.row * 10 + c.col;
    const goA = 118 + order * 1.05;
    const gone = seg(f, goA, goA + 18);
    const inA = 186 + (3 - c.row) * 11 + c.col * 2.2;
    const land = seg(f, inA, inA + 52);
    let y, o, s, rot;
    if (f < inA) {
      y = mix(0, 40, inCubic(gone)); o = 1 - gone;
      rot = mix(0, 6 * (c.col % 2 ? 1 : -1), gone); s = mix(1, .9, gone);
    } else {
      const kk = settle(land, 1.15);
      y = mix(-520 - c.row * 30, 0, kk); o = cl(land * 3.4);
      rot = mix(3 * (c.col % 2 ? 1 : -1), 0, outQuint(land)); s = mix(1.04, 1, outQuint(land));
    }
    c.el.style.opacity = o;
    c.el.style.transform = `translateY(${y}px) rotate(${rot}deg) scale(${s})`;
    if (c.k === "space") {
      c.span.textContent = f > 268 ? "glyf" : "";
      c.span.style.opacity = seg(f, 268, 292);
    }
    if (BOUND.has(c.k)) {
      const p = seg(f, 262 + c.col * 3, 292 + c.col * 3);
      c.dot.style.opacity = p; c.dot.style.transform = `scale(${settle(p, 1.6)})`;
    }
  });
  const st = seg(f, 236, 292);
  toolsEl.style.opacity = f < 236 ? 0 : cl(st * 2.4);
  toolsEl.style.transform = `translateY(${mix(-60, 0, settle(st, 1.1))}px)`;
  toolEls.forEach((el, i) => {
    const a = seg(f, 236 + i * 4, 272 + i * 4);
    el.style.opacity = a;
    el.style.transform = `translateY(${mix(-12, 0, outQuint(a))}px) scale(${mix(.74, 1, settle(a, 1.3))})`;
  });
  if (f < 236) { S.chip.style.opacity = 0; S.think.style.opacity = 0; S.wallet.style.opacity = 0; }
}

// The per-frame entry point. Everything an act may leave behind is cleared
// here first, so a frame never inherits the one before it: the render jumps
// around the timeline and each frame has to stand on its own.
window.seek = f => {
  S.chip.style.opacity = 0; S.think.style.opacity = 0; S.wallet.style.opacity = 0;
  draw(f);
};
window.TOTAL = LAST;
window.FPS = 60;
window.SIZE = { width: 1920, height: 1080 };
window.seek(0);
document.body.dataset.ready = "1";
</script>
