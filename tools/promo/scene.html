<title>Glyf waitlist film</title>
<!--
  The waitlist film, one frame at a time. 1920x1080.

  One folding phone, closed, that opens on camera: the cover screen swings
  away on the hinge, a light runs across the inner display as it flattens,
  and the app lands on a screen twice as wide. Headline on the left, the
  device on the right, the way the desktop site is laid out.

    0  the fold opens, the keyboard forms   Type less. glyf more.
    1  a bill split                         Do the math. Get paid.
    2  a private payment                    Pay on Solana. Privately.
    3  a rewrite                            Type it messy. Send it polished.
    4  the card                             The AI keyboard that does the rest.

  The fold is real 3D: the left half is a panel hinged on its right edge,
  carrying the inner display on its front and the cover screen on its back.
  Rotate it from -180 to 0 and the phone opens exactly as a book does. The app
  is a flat layer over the open screen rather than a third copy inside the
  panels, so it fades up once the hinge is flat.

  Typing is typed: every character is a keystroke at a fixed cadence, the key
  it came from dips as it lands, the number layer comes up for the sum, and
  the strip carries real candidates for the word in progress.

  Nothing animates by itself: `seek(f)` draws frame f and only frame f.
  The keyboard is the real one's arithmetic (GlassTokens.swift), widened to
  the open screen by the same formula the phone uses.
-->

<script>
// ======================================================== easing
const cl = v => v < 0 ? 0 : v > 1 ? 1 : v;
const seg = (f, a, b) => cl((f - a) / (b - a));
const outQuint = x => 1 - Math.pow(1 - x, 5);
const inCubic = x => x * x * x;
const inOutQuint = x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2;
const inOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const settle = (x, b = 1.25) => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x) * Math.cos(x * Math.PI * b);
const mix = (a, b, x) => a + (b - a) * x;
const pulse = (f, a, b, r = 20, fo = 18) => Math.min(outQuint(seg(f, a, a + r)), 1 - outQuint(seg(f, b - fo, b)));

// ======================================================== keyboard
// The phone's own formula, at the open screen's width.
const W = 744, MARGIN = 12, HGAP = 11, PITCH = 64, KEYH = 52;
const KEYW = (W - MARGIN * 2 - HGAP * 9) / 10, SIDEW = KEYW * 1.35, TOOLS_H = 62;
const BOUND = new Set(["v", "c"]);
const LAYERS = {
  abc: [
    "qwertyuiop".split("").map(k => ({ k, w: KEYW })),
    "asdfghjkl".split("").map(k => ({ k, w: KEYW })),
    [{ k: "⇧", w: SIDEW, fn: 1 }, ..."zxcvbnm".split("").map(k => ({ k, w: KEYW })), { k: "⌫", w: SIDEW, fn: 1 }],
    [{ k: "123", w: SIDEW, fn: 1 }, { k: "☺", w: KEYW, fn: 1 }, { k: "space", w: 0 }, { k: "⏎", w: SIDEW, fn: 1 }],
  ],
  num: [
    "1234567890".split("").map(k => ({ k, w: KEYW })),
    "-/:;()$&@\"".split("").map(k => ({ k, w: KEYW })),
    [{ k: "#+=", w: SIDEW, fn: 1 }, ...".,?!'".split("").map(k => ({ k, w: KEYW * 1.34 })), { k: "⌫", w: SIDEW, fn: 1 }],
    [{ k: "ABC", w: SIDEW, fn: 1 }, { k: "☺", w: KEYW, fn: 1 }, { k: "space", w: 0 }, { k: "⏎", w: SIDEW, fn: 1 }],
  ],
};
const layers = {};
for (const [name, rows] of Object.entries(LAYERS)) {
  const host = document.getElementById(name), cells = [];
  rows.forEach((row, r) => {
    const sp = row.find(c => c.k === "space");
    if (sp) sp.w = W - MARGIN * 2 - (row.reduce((s, c) => s + c.w, 0) + HGAP * (row.length - 1));
    const used = row.reduce((s, c) => s + c.w, 0) + HGAP * (row.length - 1);
    let x = name === "abc" && r === 1 ? MARGIN + (KEYW + HGAP) / 2 : MARGIN + (W - MARGIN * 2 - used) / 2;
    row.forEach((c, i) => {
      const el = document.createElement("div");
      el.className = "key" + (c.fn ? " fn" : "") + (c.k === "space" ? " space" : "");
      Object.assign(el.style, { left: x + "px", top: (TOOLS_H + r * PITCH) + "px", width: c.w + "px", height: KEYH + "px" });
      const s = document.createElement("span"); s.textContent = c.k === "space" ? "" : c.k;
      const dot = document.createElement("i"); dot.className = "dot";
      el.append(s, dot); host.appendChild(el);
      cells.push({ el, span: s, dot, ...c, row: r, col: i, cx: x + c.w / 2, cy: TOOLS_H + r * PITCH + KEYH / 2 });
      x += c.w + HGAP;
    });
  });
  layers[name] = { host, cells, find: k => cells.find(c => c.k === k) };
}
const abc = layers.abc, num = layers.num;

const NS = "http://www.w3.org/2000/svg";
const TOOLS = ["grid",
  "M10.2 3.6a6.6 6.6 0 1 0 0 13.2 6.6 6.6 0 0 0 0-13.2Z|M15.2 15.2l5 5",
  "M6.4 2.8h7.2a2 2 0 0 1 2 2v9.6a2 2 0 0 1-2 2H6.4a2 2 0 0 1-2-2V4.8a2 2 0 0 1 2-2Z|M8.6 6.2h9a2 2 0 0 1 2 2v9.6a2 2 0 0 1-2 2h-7.2a2 2 0 0 1-2-2",
  "M3.4 4.6h17.2a1.8 1.8 0 0 1 1.8 1.8v11.2a1.8 1.8 0 0 1-1.8 1.8H3.4a1.8 1.8 0 0 1-1.8-1.8V6.4a1.8 1.8 0 0 1 1.8-1.8Z|M7.6 12.4a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4Z|M4.4 16.4c.6-1.8 1.9-2.6 3.2-2.6s2.6.8 3.2 2.6|M14 9.4h5|M14 12.6h5",
  "M12 2.6a3 3 0 0 1 3 3v5.8a3 3 0 1 1-6 0V5.6a3 3 0 0 1 3-3Z|M5.4 11.2a6.6 6.6 0 0 0 13.2 0|M12 17.8v3.6",

const FPC = 5.2;
function typing(f, start, text) {
  const n = Math.max(0, Math.min(text.length, Math.floor((f - start) / FPC)));
  return { n, out: text.slice(0, n), ch: n ? text[n - 1] : null,
           since: f - (start + (n - 1) * FPC), done: n >= text.length };
}
const KEYNAME = c => c === " " ? "space" : c;
const SUGG = {
  ya: ["ya", "yeah", "yay"], il: ["il", "I'll", "ill"], ill: ["ill", "I'll", "ails"],
  se: ["se", "see", "send"], sen: ["sen", "send", "sent"], send: ["send", "send", "sent"],
  it: ["it", "it", "its"], so: ["so", "so", "soon"], soo: ["soo", "soon", "soot"],
  soon: ["soon", "soon", "sooner"], do: ["do", "do", "don't"], don: ["don", "don't", "done"],
  dont: ["dont", "don't", "done"], wo: ["wo", "won't", "wow"], wor: ["wor", "work", "worry"],
  worr: ["worr", "worry", "worried"], worry: ["worry", "worry", "worried"],
  wh: ["wh", "what", "when"], wha: ["wha", "what", "whats"], what: ["what", "what", "whats"],
  ti: ["ti", "time", "till"], tim: ["tim", "time", "timer"], time: ["time", "time", "times"],
  fo: ["fo", "for", "form"], for: ["for", "for", "fork"], we: ["we", "we", "week"],
};
function suggestFor(text) {
  const w = (text.split(" ").pop() || "").toLowerCase();
  if (w.length < 2) return null;
  return SUGG[w] || SUGG[w.slice(0, 3)] || SUGG[w.slice(0, 2)] || null;
}

// The fold: closed at -180, flat at 0. Everything else follows from it.
const OPEN_A = 150, OPEN_B = 268;
function foldAngle(f) { return mix(-180, 0, inOutCubic(seg(f, OPEN_A, OPEN_B))); }

function tapAt(f, a, x, y, hold = 24) {

  }

}
function dipFor(layer, ch, since) {

function caretTo(f, hidden) {

function draw(f) {

  const nextAt = idx < ACTS.length - 1 ? ACTS[idx + 1].at : 1e9;
